# OpenAPI document and Swagger UI of this service (Swagger UI only in dev/test).
# Loaded via quarkus.config.locations in application.properties.

%dev,test.quarkus.smallrye-openapi.info-title=Global Learning API
%dev.quarkus.smallrye-openapi.info-title=Global Learning API (development)
%test.quarkus.smallrye-openapi.info-title=Global Learning API(test)
%dev,test.quarkus.smallrye-openapi.info-version=1.0.1
%dev,test.quarkus.smallrye-openapi.info-description=Global Learning API to manage federated learning, queries and general logging
%dev,test.quarkus.smallrye-openapi.info-terms-of-service=Your terms here
%dev,test.quarkus.smallrye-openapi.info-contact-email=simon.suewer@uni-hamburg.de
%dev,test.quarkus.smallrye-openapi.info-contact-name=Example API Support
%dev,test.quarkus.smallrye-openapi.info-contact-url=http://exampleurl.com/contact
%dev,test.quarkus.smallrye-openapi.info-license-name=Apache 2.0
