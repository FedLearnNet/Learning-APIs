# Security of this service: OIDC (Keycloak), browser login (BFF), service accounts, CORS.
# Loaded via quarkus.config.locations in application.properties.

# OIDC
# endpoints/urls
# discovery is buggy with the nginx setup, so we disable it and set the endpoints and urls manually
quarkus.oidc.discovery-enabled=false

## URLS
quarkus.oidc.auth-server-url=http://keycloak:8080/auth/realms/FLNet-Platform
quarkus.oidc.token.issuer=VIA_ENV
%dev,test.quarkus.oidc.auth-server-url=https://staging.featurecloud.ai/feddb/global-auth/realms/FederatedDB_Global

%dev,test.quarkus.oidc.token.issuer=https://staging.featurecloud.ai/feddb/global-auth/realms/FederatedDB_Global

## Endpoints
quarkus.oidc.jwks-path=/protocol/openid-connect/certs
quarkus.oidc.token-path=/protocol/openid-connect/token
quarkus.oidc.authorization-path=/protocol/openid-connect/auth
quarkus.oidc.introspection-path=/protocol/openid-connect/token/introspect

# Login credentials
quarkus.oidc.client-id=database-api

quarkus.oidc.credentials.secret=VIA_ENV

# Security default: every REST endpoint needs a logged-in user unless it is annotated otherwise
# (@PermitAll = public, @RolesAllowed = stricter), so REST endpoints need no @Authenticated.
# Not applied to WebSockets, annotate those explicitly.
quarkus.security.jaxrs.default-roles-allowed=**

# Backend-for-frontend (bff): browsers log in via the OIDC code flow and only hold an encrypted
# HttpOnly session cookie. Services, FL clients and tools keep using Bearer tokens/API keys (hybrid).
quarkus.oidc.application-type=hybrid
# tests expect 401 for anonymous calls; the browser code flow would answer them with a redirect to Keycloak
%test.quarkus.oidc.application-type=service
quarkus.oidc.end-session-path=/protocol/openid-connect/logout
# code flow identities are built from the ID token, but Keycloak puts the realm roles into the access token
quarkus.oidc.roles.source=accesstoken
quarkus.oidc.authentication.pkce-required=true
# XHR requests (X-Requested-With header) get 499 instead of a redirect to Keycloak; the frontend redirects itself
quarkus.oidc.authentication.java-script-auto-redirect=false
# lax, not strict: after the code exchange Quarkus redirects within the redirect chain started at Keycloak,
# where browsers drop strict cookies (login loop). CSRF is covered by BffCsrfFilter (X-Requested-With).
quarkus.oidc.authentication.cookie-same-site=lax
# path under which the browser reaches this service through nginx, so the cookie is only sent here
quarkus.oidc.authentication.cookie-path=/api
quarkus.oidc.token.refresh-expired=true
quarkus.oidc.token-state-manager.split-tokens=true
# Public address of the frontend (DEPLOYED_ON_ADDRESS). Absolute because behind nginx the service sees neither
# the stripped path prefix nor a mapped external port. The callback URL adds this service's prefix (cookie-path).
flnet.bff.frontend-url=VIA_ENV
%dev,test.flnet.bff.frontend-url=http://localhost:4201
quarkus.oidc.authentication.redirect-path=${flnet.bff.frontend-url}${quarkus.oidc.authentication.cookie-path}/bff/login
quarkus.oidc.logout.path=/bff/logout
quarkus.oidc.logout.post-logout-path=${flnet.bff.frontend-url}/
# trust X-Forwarded-Proto from nginx, so the session cookie gets the Secure flag behind HTTPS
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true

# details for the admin client
quarkus.keycloak.admin-client.server-url=http://keycloak:8080/auth
quarkus.keycloak.admin-client.realm=FLNet-Platform
%dev,test.quarkus.keycloak.admin-client.server-url=https://staging.featurecloud.ai/feddb/global-auth
%dev,test.quarkus.keycloak.admin-client.realm=FederatedDB_Global
quarkus.keycloak.admin-client.client-id=database-api
quarkus.keycloak.admin-client.client-secret=VIA_ENV
quarkus.keycloak.admin-client.grant-type=CLIENT_CREDENTIALS

# Misc
quarkus.oidc.connection-retry-count=10
quarkus.oidc.connection-timeout=20S
quarkus.oidc.connection-delay=30S
quarkus.oidc.tls.verification=none

# Let browser WebSocket clients carry their user bearer token during the HTTP upgrade.
quarkus.websockets-next.server.supported-subprotocols=bearer-token-carrier
quarkus.websockets-next.server.propagate-subprotocol-headers=true

# service account (client credentials of this service) for the typed data modeler clients
quarkus.oidc-client.auth-server-url=${quarkus.oidc.auth-server-url}
quarkus.oidc-client.discovery-enabled=false
quarkus.oidc-client.token-path=/protocol/openid-connect/token
quarkus.oidc-client.client-id=${quarkus.oidc.client-id}
quarkus.oidc-client.credentials.secret=${quarkus.oidc.credentials.secret}
quarkus.oidc-client.grant.type=client
quarkus.oidc-client.early-tokens-acquisition=false

#cors
quarkus.http.cors.enabled=true
%dev,test.quarkus.http.cors.origins=/.*/
%prod,staging.quarkus.http.cors.origins=
quarkus.http.cors.exposed-headers=Content-Disposition,Content-Length,Content-Type
%dev.quarkus.http.host-validation.allowed-hosts=localhost,127.0.0.1,[::1],host.docker.internal
