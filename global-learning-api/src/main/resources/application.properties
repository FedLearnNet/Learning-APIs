# OIDC/security, OpenAPI/Swagger and flnet.* settings live in their own files
quarkus.config.locations=security.properties,openapi.properties,flnet.properties

quarkus.http.test-port=8083
quarkus.http.test-ssl-port=8446
quarkus.http.test-timeout=10s
quarkus.http.limits.max-body-size=1000M
quarkus.http.limits.max-form-attribute-size=100M

quarkus.log.console.json.enabled=false
%test,dev,staging.quarkus.log.console.json.enabled=false
quarkus.log.level=INFO

#Startup
quarkus.banner.path=banner/banner.txt
%dev.quarkus.banner.path=banner/banner-dev.txt
%test.quarkus.banner.path=banner/banner-test.txt
%staging.quarkus.banner.path=banner/banner-stage.txt

#Docker devservice
quarkus.datasource.devservices.enabled=false
quarkus.keycloak.devservices.enabled=false
# not used, all profiles use the compose devservice instead!
quarkus.devservices.timeout=15m
%test.quarkus.compose.devservices.enabled=false
#%test.quarkus.compose.devservices.profiles=test
%dev.quarkus.compose.devservices.profiles=dev
# Keep DB and registry volumes across dev restarts
%dev.quarkus.compose.devservices.remove-volumes=false
%test.quarkus.compose.devservices.profiles=test

#database
quarkus.datasource.db-kind = postgresql

%prod,staging.quarkus.datasource.jdbc.url = jdbc:postgresql://global-learning-db:5432/global-learning-management
%prod,staging.quarkus.datasource.username = user
%prod,staging.quarkus.datasource.password =
# Password must be set via env in production for security reasons

%prod,staging.quarkus.hibernate-orm.schema-management.strategy=validate
%prod,staging.quarkus.hibernate-orm.sql-load-script=no-file

#TODO for e2e we need to enable the compose devservice but not yet implemented, so for speedup we disable it
%dev,test.quarkus.datasource.jdbc.url = jdbc:postgresql://localhost:5433/global-learning-management
%dev,test.quarkus.datasource.username = user
%dev,test.quarkus.datasource.password = password
%dev,test.quarkus.hibernate-orm.schema-management.strategy = drop-and-create
%dev.quarkus.hibernate-orm.sql-load-script = import-dev/apps.sql,import-dev/project.sql,import-dev/experiments.sql,import-dev/model.sql,import-dev/data-analysis.sql
%test.quarkus.hibernate-orm.sql-load-script = import-test.sql
quarkus.hibernate-orm.mapping.format.global=ignore
# TODO: Right now we preload the random forest app in production, at some point this needs to be
# cleaner!

# Flyway
quarkus.flyway.enabled=false
%prod,staging.quarkus.flyway.enabled=true
%prod,staging.quarkus.flyway.migrate-at-start=true
%prod,staging.quarkus.flyway.baseline-on-migrate=true

flnet.runtime.overhead.enabled=false
%dev.flnet.runtime.overhead.enabled=true

#socket
quarkus.websockets-next.server.max-frame-size=1048576
quarkus.websockets-next.server.max-message-size=16777216
quarkus.websockets-next.server.per-message-compression-supported=true
quarkus.websockets-next.server.compression-level=6

%dev.quarkus.websockets-next.server.traffic-logging.enabled=false
%dev.quarkus.websockets-next.server.traffic-logging.text-payload-limit=50
#%dev.quarkus.log.category."io.quarkus.websockets.next.traffic".level=DEBUG
quarkus.websockets-next.server.auto-ping-interval=2

#servives
%prod,staging.quarkus.rest-client.data-modeler-service.url=http://datamodeler-api:8080
%test.quarkus.rest-client.data-modeler-service.url=http://localhost:8086
# data modeler started locally (dev port 8086), it is not exposed on the public nginx anymore
%dev.quarkus.rest-client.data-modeler-service.url=http://localhost:8086

%prod,staging.quarkus.rest-client.orch-docker-service.url=http://orch-api:8080
%dev,test.quarkus.rest-client.orch-docker-service.url=http://localhost:8191
#next orch is for local development
#%dev,test.quarkus.rest-client.orch-docker-service.url=http://localhost:8082
quarkus.rest-client.orch-docker-service.read-timeout=200000

%prod,staging.quarkus.rest-client.local-controller.url=http://controller:8000
%dev,test.quarkus.rest-client.local-controller.url=http://localhost:8192

%prod,staging.quarkus.rest-client.relay-api.url=http://relay-server:9140
%dev,test.quarkus.rest-client.relay-api.url=http://localhost:9160

%dev.quarkus.datasource.dev-ui.allow-sql=true
%dev.quarkus.hibernate-orm.dev-ui.allow-hql=true

#langchain4j
quarkus.langchain4j.timeout=60s
quarkus.langchain4j.chat-model.provider=openai
quarkus.langchain4j.openai.base-url=https://dev.chat.cosy.bio/api
#json later
#quarkus.langchain4j.openai.chat-model.format=text
quarkus.langchain4j.openai.chat-model.log-requests = false
quarkus.langchain4j.openai.chat-model.log-responses = false

quarkus.langchain4j.openai.chat-model.model-name=gpt-oss:latest
#quarkus.langchain4j.openai.chat-model.model-name=qwen3.5:2b
quarkus.langchain4j.openai.max-retries=3
quarkus.langchain4j.openai.timeout=30s
quarkus.langchain4j.openai.embedding-model.model-name=snowflake-arctic-embed2:latest
quarkus.langchain4j.pgvector.dimension=1024
quarkus.langchain4j.openai.api-key=VIA_ENV

#external services
quarkus.rest-client.semantic-scholar-client.url=https://api.semanticscholar.org/
quarkus.rest-client.pubmed-client.url=https://eutils.ncbi.nlm.nih.gov/
