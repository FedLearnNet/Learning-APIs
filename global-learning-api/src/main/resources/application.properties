quarkus.http.test-port=8083
quarkus.http.test-ssl-port=8446
quarkus.http.test-timeout=10s
quarkus.http.limits.max-body-size=1000M
quarkus.http.limits.max-form-attribute-size=100M


quarkus.log.console.json.enabled=false
%test,dev,staging.quarkus.log.console.json.enabled=false
quarkus.log.level=INFO

%dev,test.quarkus.smallrye-openapi.info-title=Global Learning API
%dev.quarkus.smallrye-openapi.info-title=Global Learning API (development)
%test.quarkus.smallrye-openapi.info-title=Global Learning API(test)
%dev,test.quarkus.smallrye-openapi.info-version=1.0.1
%dev,test.quarkus.smallrye-openapi.info-description=Global Learning API to manage federated learning, queries and general logging
%dev,test.quarkus.smallrye-openapi.info-terms-of-service=Your terms here
%dev,test.quarkus.smallrye-openapi.info-contact-email=simon.suewer@uni-hamburg.de
%dev,test.quarkus.smallrye-openapi.info-contact-name=Example API Support
%dev,test.quarkus.smallrye-openapi.info-contact-url=http://exampleurl.com/contact
%dev,test.quarkus.smallrye-openapi.info-license-name=Apache 2.0
%dev,test.quarkus.smallrye-openapi.info-license-url=https://www.apache.org/licenses/LICENSE-2.0.html
%dev,test.quarkus.swagger-ui.always-include=true

#Startup
quarkus.banner.path=banner/banner.txt
%dev.quarkus.banner.path=banner/banner-dev.txt
%test.quarkus.banner.path=banner/banner-test.txt
%staging.quarkus.banner.path=banner/banner-stage.txt

#Docker devservice
quarkus.datasource.devservices.enabled=false
quarkus.keycloak.devservices.enabled=false
# not used, all profiles use the compose devservice instead!
quarkus.devservices.timeout=15m
%test.quarkus.compose.devservices.enabled=false
#%test.quarkus.compose.devservices.profiles=test
%dev.quarkus.compose.devservices.profiles=dev
%test.quarkus.compose.devservices.profiles=test


# OIDC
# endpoints/urls
# discovery is buggy with the nginx setup, so we disable it and set the endpoints and urls manually
quarkus.oidc.discovery-enabled=false

## URLS
quarkus.oidc.auth-server-url=http://keycloak:8080/auth/realms/FLNet-Platform
quarkus.oidc.token.issuer=VIA_ENV
%dev,test.quarkus.oidc.auth-server-url=https://staging.featurecloud.ai/feddb/global-auth/realms/FederatedDB_Global

%dev,test.quarkus.oidc.token.issuer=https://staging.featurecloud.ai/feddb/global-auth/realms/FederatedDB_Global

## Endpoints
quarkus.oidc.jwks-path=/protocol/openid-connect/certs
quarkus.oidc.token-path=/protocol/openid-connect/token
quarkus.oidc.authorization-path=/protocol/openid-connect/auth
quarkus.oidc.introspection-path=/protocol/openid-connect/token/introspect

# Login credentials
quarkus.oidc.client-id=database-api

quarkus.oidc.credentials.secret=VIA_ENV

# details for the admin client
quarkus.keycloak.admin-client.server-url=http://keycloak:8080/auth
quarkus.keycloak.admin-client.realm=FLNet-Platform
%dev,test.quarkus.keycloak.admin-client.server-url=https://staging.featurecloud.ai/feddb/global-auth
%dev,test.quarkus.keycloak.admin-client.realm=FederatedDB_Global
quarkus.keycloak.admin-client.client-id=database-api
quarkus.keycloak.admin-client.client-secret=VIA_ENV
quarkus.keycloak.admin-client.grant-type=CLIENT_CREDENTIALS

# Misc
quarkus.oidc.connection-retry-count=10
quarkus.oidc.connection-timeout=20S
quarkus.oidc.connection-delay=30S
quarkus.oidc.tls.verification=none

# Let browser WebSocket clients carry their user bearer token during the HTTP upgrade.
quarkus.websockets-next.server.supported-subprotocols=bearer-token-carrier
quarkus.websockets-next.server.propagate-subprotocol-headers=true

# Swagger
%dev.quarkus.smallrye-openapi.security-scheme=oauth2-implicit
%dev.quarkus.smallrye-openapi.security-scheme-name=Keycloak

%dev.quarkus.smallrye-openapi.oauth2-implicit-authorization-url=https://staging.featurecloud.ai/feddb/global-auth/realms/FederatedDB_Global/protocol/openid-connect/auth
%dev.quarkus.smallrye-openapi.oauth2-implicit-refresh-url=https://staging.featurecloud.ai/feddb/global-auth/realms/FederatedDB_Global/protocol/openid-connect/token
%dev.quarkus.swagger-ui.oauth2-redirect-url=http://localhost:8080/q/swagger-ui/oauth2-redirect.html
%dev.quarkus.swagger-ui.oauth-client-id=database-api

#database
quarkus.datasource.db-kind = postgresql

%prod,staging.quarkus.datasource.jdbc.url = jdbc:postgresql://global-learning-db:5432/global-learning-management
%prod,staging.quarkus.datasource.username = user
%prod,staging.quarkus.datasource.password =
# Password must be set via env in production for security reasons

%prod,staging.quarkus.hibernate-orm.schema-management.strategy=validate
%prod,staging.quarkus.hibernate-orm.sql-load-script=no-file

#TODO for e2e we need to enable the compose devservice but not yet implemented, so for speedup we disable it
%dev,test.quarkus.datasource.jdbc.url = jdbc:postgresql://localhost:5433/global-learning-management
%dev,test.quarkus.datasource.username = user
%dev,test.quarkus.datasource.password = password
%dev,test.quarkus.hibernate-orm.schema-management.strategy = drop-and-create
%dev.quarkus.hibernate-orm.sql-load-script = import-dev/apps.sql,import-dev/project.sql,import-dev/experiments.sql,import-dev/model.sql,import-dev/data-analysis.sql
%test.quarkus.hibernate-orm.sql-load-script = import-test.sql
quarkus.hibernate-orm.mapping.format.global=ignore
# TODO: Right now we preload the random forest app in production, at some point this needs to be
# cleaner!

# Flyway
quarkus.flyway.enabled=false
%prod,staging.quarkus.flyway.enabled=true
%prod,staging.quarkus.flyway.migrate-at-start=true
%prod,staging.quarkus.flyway.baseline-on-migrate=true

posymed.runtime.overhead.enabled=false
%dev.posymed.runtime.overhead.enabled=true

#cors
quarkus.http.cors.enabled=true
%dev,test.quarkus.http.cors.origins=/.*/
%prod,staging.quarkus.http.cors.origins=
quarkus.http.cors.exposed-headers=Content-Disposition,Content-Length,Content-Type
%dev.quarkus.http.host-validation.allowed-hosts=localhost,127.0.0.1,[::1],host.docker.internal

#socket
quarkus.websockets-next.server.max-frame-size=1048576
quarkus.websockets-next.server.max-message-size=16777216
quarkus.websockets-next.server.per-message-compression-supported=true
quarkus.websockets-next.server.compression-level=6

%dev.quarkus.websockets-next.server.traffic-logging.enabled=false
%dev.quarkus.websockets-next.server.traffic-logging.text-payload-limit=50
#%dev.quarkus.log.category."io.quarkus.websockets.next.traffic".level=DEBUG
quarkus.websockets-next.server.auto-ping-interval=2

#servives
%prod,staging.quarkus.rest-client.data-modeler-service.url=http://datamodeler-api:8080
%test.quarkus.rest-client.data-modeler-service.url=http://localhost:8086
#Change this if you dont wanna work with the global one
%dev.quarkus.rest-client.data-modeler-service.url=https://dev.federated-learning.net/data-modeler

%prod,staging.quarkus.rest-client.orch-docker-service.url=http://orch-api:8080
%dev,test.quarkus.rest-client.orch-docker-service.url=http://localhost:8191
#next orch is for local development
#%dev,test.quarkus.rest-client.orch-docker-service.url=http://localhost:8082
quarkus.rest-client.orch-docker-service.read-timeout=200000

%prod,staging.quarkus.rest-client.local-controller.url=http://controller:8000
%dev,test.quarkus.rest-client.local-controller.url=http://localhost:8192

%prod,staging.quarkus.rest-client.relay-api.url=http://relay-server:9140
%dev,test.quarkus.rest-client.relay-api.url=http://localhost:9160
quarkus.rest-client.gitlab-api.url=https://gitlab.cosy.bio/api/v4


%dev.quarkus.datasource.dev-ui.allow-sql=true
%dev.quarkus.hibernate-orm.dev-ui.allow-hql=true


#langchain4j
quarkus.langchain4j.timeout=60s
quarkus.langchain4j.chat-model.provider=openai
quarkus.langchain4j.openai.base-url=https://dev.chat.cosy.bio/api
#json later
#quarkus.langchain4j.openai.chat-model.format=text
quarkus.langchain4j.openai.chat-model.log-requests = false
quarkus.langchain4j.openai.chat-model.log-responses = false

quarkus.langchain4j.openai.chat-model.model-name=gpt-oss:latest
#quarkus.langchain4j.openai.chat-model.model-name=qwen3.5:2b
quarkus.langchain4j.openai.max-retries=3
quarkus.langchain4j.openai.timeout=30s
quarkus.langchain4j.openai.embedding-model.model-name=snowflake-arctic-embed2:latest
quarkus.langchain4j.pgvector.dimension=1024
quarkus.langchain4j.openai.api-key=VIA_ENV

# FLnet config
%dev.flnet.ingestor.enable-start-up=false
%dev.flnet.ingestor.ignore-start-up-check=false
%test.flnet.ingestor.enable-start-up=false
flnet.ingestor.enable-start-up=true
flnet.ingestor.ignore-start-up-check=false


flnet.tool-configs.enabled=true
flnet.tool-configs.paths=tool-configs

flnet.tool-imports.enabled=true
# external like http:///localhost:4200/store/json is also allowed
flnet.tool-imports.paths=tool-imports
flnet.tool-imports.override-existing=true
flnet.workflow-imports.enabled=true
flnet.workflow-imports.paths=workflow-imports

#pipeline
flnet.pipeline.builder.image=gitlab.cosy.bio:5050/cosybio/federated-learning/federated_db/app-build-pipeline/pipeline:latest

flnet.gitlab.issue.token=VIA_ENV
flnet.gitlab.issue.project-id=9

#Learning
flnet.federated-learning.participants.minamount=3
%test,dev,staging.flnet.federated-learning.participants.minamount=0

# Authentication for FLNet client WebSockets and protected client-only HTTP endpoints
flnet.feddb-client.auth.enable=false
%prod.flnet.feddb-client.auth.enable=true
%staging.flnet.feddb-client.auth.enable=true

#Observer
flnet.observer.enabled=false
%dev,staging.flnet.observer.enabled=true

#external services
quarkus.rest-client.semantic-scholar-client.url=https://api.semanticscholar.org/
quarkus.rest-client.pubmed-client.url=https://eutils.ncbi.nlm.nih.gov/
