# FL-Net settings of this service (flnet.*); flnet.bff.* is in security.properties.
# Loaded via quarkus.config.locations in application.properties.

# FLnet config
%dev.flnet.ingestor.enable-start-up=false
%dev.flnet.ingestor.ignore-start-up-check=false
%test.flnet.ingestor.enable-start-up=false
flnet.ingestor.enable-start-up=true
flnet.ingestor.ignore-start-up-check=false

#all import configs (tool, workflow e.g.) whitelist e.g. flnet.tool-imports.whitelist <== list
flnet.tool-configs.enabled=true
flnet.tool-configs.paths=tool-configs

flnet.tool-imports.enabled=true
# external like http:///localhost:4200/store/json is also allowed
# However only the meta information is taken but the image is rebuilt in the registry belonging
# to this deployment
flnet.tool-imports.paths=tool-imports
flnet.tool-imports.override-existing=true
%dev.flnet.tool-imports.remove-image-on-build-failure=false
# Local username granted ownership of imported tools
flnet.tool-imports.owner=admin
%dev,test.flnet.tool-imports.owner=test
# Build imported tools only if their image is missing from the registry (default).
#flnet.tool-imports.build-on-import=IF_NOT_EXISTS_IN_REGISTRY
#flnet.tool-imports.whitelist=us130-hospital-readmission-federated-nn.json
flnet.workflow-imports.enabled=true
flnet.workflow-imports.paths=workflow-imports

#Learning
flnet.federated-learning.participants.minamount=3
%test,dev,staging.flnet.federated-learning.participants.minamount=0

#Observer
flnet.observer.enabled=false
%dev,staging.flnet.observer.enabled=true

#pipeline
flnet.pipeline.builder.image=ghcr.io/fedlearnnet/tool-build-pipeline/pipeline:latest
%dev.flnet.pipeline.builder.image=ghcr.io/fedlearnnet/tool-build-pipeline/pipeline:staging
# Rescan built tool images every Monday at 03:00 UTC.
flnet.pipeline.rescan.cron=0 0 3 ? * MON
%dev,test.flnet.pipeline.rescan.cron=off
