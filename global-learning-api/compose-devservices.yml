services:
  global-learning-api-db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: global-learning-management
      POSTGRES_USER: user
    volumes:
      - global-learning-api-db-volume:/var/lib/postgresql
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d global-learning-management" ]
      interval: 5s
      timeout: 5s
      retries: 5
    labels:
      # Change to `true` to disable waiting for ports
      #io.quarkus.devservices.compose.wait_for.ports.disable: true
      # Or set a custom timeout for port waiting
      io.quarkus.devservices.compose.wait_for.ports.timeout: "30s"
    networks:
      - global-learning-network
  orch-api:
    image: gitlab.cosy.bio:5050/cosybio/federated-learning/federated_db/orch-api/orch-api:staging
    user: "0:0"
    ports:
      - '8191:8080'
    env_file:
      - orch_secrets.env
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://global-learning-api-db:5432/global-learning-management
      QUARKUS_DATASOURCE_USERNAME: user
      QUARKUS_DATASOURCE_PASSWORD: password
      QUARKUS_LOG_CONSOLE_JSON_ENABLED: false
      CONTAINER_HOST_OVERRIDE: host.docker.internal
      CONTAINER_NETWORK_NAMES: global-learning-network
      CONTAINER_NETWORK_CONTROLLER: controller:8001
      CONTAINER_FILE_TRANSFER_VOLUME_NAME: global-orch-data
      QUARKUS_LOG_CATEGORY_"bio.cosy.featurecloud"_LEVEL: DEBUG
      CONTAINER_MEMORY_LIMIT: 34179869184
      CONTAINER_MEMORY_SWAP: 68179869184
      PIPELINE_DOCKER_LOGIN: true
      PIPELINE_HOST_REMOVE: false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - global-orch-data:/mnt/input:rw
    depends_on:
      global-learning-api-db:
        condition: service_healthy
    labels:
      # Change to `true` to disable waiting for ports
      io.quarkus.devservices.compose.wait_for.ports.disable: true
      # Or set a custom timeout for port waiting
      #io.quarkus.devservices.compose.wait_for.ports.timeout: "30s"
    networks:
      - global-learning-network
  controller:
    image: gitlab.cosy.bio:5050/cosybio/federated-learning/federated_db/feature-cloud-controller/controller:staging
    ports:
      - '8192:8000'
    profiles:
      - dev
    environment:
      RELAY_ADDRESS: relay
      RELAY_API_PORT: 9140
      WORKFLOW_LEARNING_API_WS_ADDRESS: "ws://host.docker.internal:8080"
      LOG_LEVEL_STDOUT: "DEBUG"
    labels:
      # Change to `true` to disable waiting for ports
      io.quarkus.devservices.compose.wait_for.ports.disable: true
      # Or set a custom timeout for port waiting
      #io.quarkus.devservices.compose.wait_for.ports.timeout: "30s"
    networks:
      - global-learning-network

  controller-test:
    image: gitlab.cosy.bio:5050/cosybio/federated-learning/federated_db/feature-cloud-controller/controller:staging
    ports:
      - '8192:8000'
    profiles:
      - test
    environment:
      RELAY_ADDRESS: relay
      RELAY_API_PORT: 9140
      WORKFLOW_LEARNING_API_WS_ADDRESS: "ws://host.docker.internal:8083"
      LOG_LEVEL_STDOUT: "DEBUG"
    labels:
      io.quarkus.devservices.compose.wait_for.ports.disable: true
    networks:
      - global-learning-network

  relay:
    image: gitlab.cosy.bio:5050/cosybio/federated-learning/federated_db/feature-cloud-controller/controller-relay:staging
    ports:
      - '9160:9140'
      - '9161:9141'
    environment:
      RELAY_TLS_MODE: "off"
      RELAY_MODE: "dev"
      CERT_DNS_NAMES: "featurecloud,relay-test"
    labels:
      io.quarkus.devservices.compose.wait_for.ports.disable: true
    networks:
      - global-learning-network

volumes:
  global-learning-api-db-volume:
  global-orch-data:
    name: "global-orch-data"
  datamodeler-db:

networks:
  global-learning-network: