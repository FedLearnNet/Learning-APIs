services:
  datamodeler-db:
    image: neo4j:2026.09.0
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - datamodeler-db-data:/data
      - datamodeler-db-logs:/logs
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    healthcheck:
      test: [ "CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 20
    labels:
      io.quarkus.devservices.compose.wait_for.ports.timeout: "60s"
    networks:
      - datamodeler-network

volumes:
  datamodeler-db-data:
  datamodeler-db-logs:

networks:
  datamodeler-network:
