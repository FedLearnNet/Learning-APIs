services:
  datamodeler-db:
    image: neo4j:latest
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - datamodeler-db-data:/data
      - datamodeler-db-logs:/logs
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    networks:
      - datamodeler-network

volumes:
  datamodeler-db-data:
  datamodeler-db-logs:

networks:
  datamodeler-network:
