# OpenAPI document and Swagger UI of this service (Swagger UI only in dev/test).
# Loaded via quarkus.config.locations in application.properties.

quarkus.smallrye-openapi.info-title=Global Datamodeler API
%dev.quarkus.smallrye-openapi.info-title=Global Datamodeler API (development)
%test.quarkus.smallrye-openapi.info-title=Global Datamodeler API(test)
%staging.quarkus.smallrye-openapi.info-title=Global Datamodeler API (staging)
quarkus.smallrye-openapi.info-version=1.0.1
quarkus.smallrye-openapi.info-description=Global Datamodeler API to manage ontologies, datatypes and schemas
quarkus.smallrye-openapi.info-terms-of-service=Your terms here
quarkus.smallrye-openapi.info-contact-email=simon.suewer@uni-hamburg.de
quarkus.smallrye-openapi.info-contact-name=Example API Support
quarkus.smallrye-openapi.info-contact-url=http://exampleurl.com/contact
quarkus.smallrye-openapi.info-license-name=Apache 2.0
quarkus.smallrye-openapi.info-license-url=https://www.apache.org/licenses/LICENSE-2.0.html

# enable swagger in dev, test and staging, but not prod
%staging,dev,test.quarkus.swagger-ui.always-include=true
