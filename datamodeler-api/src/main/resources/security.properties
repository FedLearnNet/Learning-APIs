# Security of this service: OIDC (Keycloak), browser login (BFF), service accounts, CORS.
# Loaded via quarkus.config.locations in application.properties.

# Auth: bearer tokens of the platform Keycloak (users via the global API, clients with their platform account)
quarkus.oidc.application-type=service
quarkus.oidc.discovery-enabled=false
quarkus.oidc.auth-server-url=http://keycloak:8080/auth/realms/FLNet-Platform
quarkus.oidc.token.issuer=VIA_ENV
%dev.quarkus.oidc.auth-server-url=https://staging.featurecloud.ai/feddb/global-auth/realms/FederatedDB_Global
%dev.quarkus.oidc.token.issuer=https://staging.featurecloud.ai/feddb/global-auth/realms/FederatedDB_Global
%test.quarkus.oidc.tenant-enabled=false
quarkus.oidc.jwks-path=/protocol/openid-connect/certs
quarkus.oidc.client-id=datamodeler-api
# only tokens issued for this service: aud must contain the client id (Keycloak audience mapper),
# otherwise any token of the realm would be accepted
%prod,staging.quarkus.oidc.token.audience=${quarkus.oidc.client-id}
quarkus.oidc.connection-retry-count=10
quarkus.oidc.connection-delay=30S
# every endpoint needs a login unless annotated otherwise (writes: Data-Modeler, long background jobs: Admin)
# Security default: every REST endpoint needs a logged-in user unless it is annotated otherwise
# (@PermitAll = public, @RolesAllowed = stricter),
# Not applied to WebSockets!
# ** is any role
quarkus.security.jaxrs.default-roles-allowed=**

# Cors
quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=*
%prod,staging.quarkus.http.cors.origins=
