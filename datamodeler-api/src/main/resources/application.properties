quarkus.http.test-port=8087
quarkus.http.port=8080
%dev.quarkus.http.port=8086
quarkus.http.test-ssl-port=8447
quarkus.http.test-timeout=10s
quarkus.devservices.timeout=5m
quarkus.http.limits.max-body-size=1000M
quarkus.http.limits.max-form-attribute-size=100M


quarkus.log.console.json.enabled=false
%test,dev.quarkus.log.console.json.enabled=false
quarkus.log.level=INFO

quarkus.smallrye-openapi.info-title=Global Datamodeler API
%dev.quarkus.smallrye-openapi.info-title=Global Datamodeler API (development)
%test.quarkus.smallrye-openapi.info-title=Global Datamodeler API(test)
%staging.quarkus.smallrye-openapi.info-title=Global Datamodeler API (staging)
quarkus.smallrye-openapi.info-version=1.0.1
quarkus.smallrye-openapi.info-description=Global Datamodeler API to manage ontologies, datatypes and schemas
quarkus.smallrye-openapi.info-terms-of-service=Your terms here
quarkus.smallrye-openapi.info-contact-email=simon.suewer@uni-hamburg.de
quarkus.smallrye-openapi.info-contact-name=Example API Support
quarkus.smallrye-openapi.info-contact-url=http://exampleurl.com/contact
quarkus.smallrye-openapi.info-license-name=Apache 2.0
quarkus.smallrye-openapi.info-license-url=https://www.apache.org/licenses/LICENSE-2.0.html
# enable swagger in dev, test and staging, but not prod
%staging,dev,test.quarkus.swagger-ui.always-include=true

#UMLS Specific
umls.language.filter=eng
# 63494934 src/main/resources/umls/MRREL.RRF
# 17390109 src/main/resources/umls/MRCONSO.RRF
umls.import.batch-size=200
umls.import.size-max=10000
umls.import.edge-size-max=10000
%dev.umls.import.size-max=10000
%dev.umls.import.edge-size-max=10000
%prod,staging.umls.import.size-max=50000000
%prod,staging.umls.import.edge-size-max=100000000
%test.umls.import.size-max=100
%test.umls.import.edge-size-max=100
umls.import.allow-self-loops=false
#https://www.nlm.nih.gov/research/umls/sourcereleasedocs/
umls.sab.filter=SNOMEDCT_US,RXNORM,LNC,ICD10CM,ICD9CM,NCBI
umls.api.key=VIA_ENV

# UMLS Import Files Configuration
%prod,staging.umls.import.folder-path=/data/umls
%prod,staging.umls.import.mrconso=MRCONSO.RRF
%prod,staging.umls.import.mrrel=MRREL.RRF
# Specifically set them to empty in dev and test, we don't import there
%dev,test.umls.import.mrconso=umls/MRCONSO.RRF
%dev,test.umls.import.mrrel=umls/MRREL.RRF

# UMLS Auto-Import Configuration (startup)
umls.auto-import.enabled=true
%dev,test.umls.auto-import.enabled=false
umls.auto-import.timeout-seconds=86400
# 24 hours timeout for auto import

#embeddingsmodel
%dev,test.embedding.model.path-to-model=sapbert/sapbert.onnx
%dev,test.embedding.model.path-to-tokenizer=sapbert/tokenizer.json
%staging,prod.embedding.model.path-to-model=/data/sapbert/sapbert.onnx
%staging,prod.embedding.model.path-to-tokenizer=/data/sapbert/tokenizer.json
quarkus.langchain4j.neo4j.dimension=768

#neo4j
%dev.quarkus.neo4j.uri = bolt://localhost:7687
%test.quarkus.neo4j.uri = bolt://localhost:7687
%dev.quarkus.neo4j.authentication.username = neo4j
%test.quarkus.neo4j.authentication.username = neo4j
%dev.quarkus.neo4j.authentication.password = password
%test.quarkus.neo4j.authentication.password = password
%prod,staging.quarkus.neo4j.uri = bolt://datamodeler-db:7687
# prod/staging auth must be set via environment variables or external config

#Docker devservice
%dev.quarkus.compose.devservices.profiles=dev
quarkus.neo4j.devservices.enabled=false
quarkus.devservices.enabled=false
%test.quarkus.neo4j.devservices.enabled=false
%test.quarkus.devservices.enabled=false

# UMLS REST API
quarkus.rest-client.umls-api.url=https://uts-ws.nlm.nih.gov
quarkus.rest-client.umls-api.connect-timeout=60000
quarkus.rest-client.umls-api.read-timeout=60000

# General REST Client Logging
%dev.quarkus.rest-client.logging.scope=request-response
%dev.quarkus.log.category."org.jboss.resteasy.reactive.server".level=DEBUG
%dev.quarkus.log.category."io.quarkus.vertx.http.runtime".level=DEBUG

# Cors
quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=*
%prod,staging.quarkus.http.cors.origins=
