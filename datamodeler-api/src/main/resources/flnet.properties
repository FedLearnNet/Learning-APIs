# FL-Net settings of this service (flnet.*); flnet.bff.* is in security.properties.
# Loaded via quarkus.config.locations in application.properties.

# Datamodeler auto-import (startup, after UMLS): ontologies -> datatypes -> schemas
# Files are generated from meta's schema CSVs with scripts/migrate_meta_schemas.py.
# Only missing nodes are created; a schema is skipped when its root already exists.
# Use the same file names in all three whitelists, e.g. flnet.schema-imports.whitelist=2026-04us130_diabetes_schema.json
flnet.ontology-imports.enabled=false
%dev.flnet.ontology-imports.enabled=true
flnet.ontology-imports.paths=datamodeler-imports/ontologies
# SapBERT embeddings for imported ontologies without one, created after all imports
flnet.ontology-imports.create-embeddings=true
flnet.datatype-imports.enabled=false
%dev.flnet.datatype-imports.enabled=true
flnet.datatype-imports.paths=datamodeler-imports/datatypes
flnet.schema-imports.enabled=false
%dev.flnet.schema-imports.enabled=true
flnet.schema-imports.paths=datamodeler-imports/schemas
