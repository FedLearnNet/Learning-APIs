name: End-to-end test

# The end-to-end test of FL-Net-CLI (a platform and two clients in DinD, every important feature) with the images
# of this repository: after each develop image build its staging images, on demand those of any branch, built here
# first and tagged e2e-<branch>. Takes hours.
on:
  workflow_run:
    workflows: ["Docker images"]
    types: [completed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      build-images:
        description: "Build and push the images of this branch first (else the staging images are tested)"
        default: true
        type: boolean

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/fedlearnnet/learning-apis
  MODULES: global-learning-api local-learning-api datamodeler-api

jobs:
  images:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build-images }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      images: ${{ steps.push.outputs.images }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build Quarkus applications
        run: bash mvnw -B -ntp package -DskipTests -Dquarkus.profile=staging
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # amd64 only, the test runs there
      - name: Build and push images
        id: push
        run: |
          tag="e2e-${GITHUB_REF_NAME//\//-}"
          images=""
          for module in $MODULES; do
            image="$REGISTRY/$module:$tag"
            docker buildx build --platform linux/amd64 --provenance=false \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              -t "$image" -f "$module/src/main/docker/Dockerfile.jvm" --push "$module"
            images="$images${images:+,}$module=$image"
          done
          echo "images=$images" >> "$GITHUB_OUTPUT"

  e2e:
    needs: images
    # also when the images job is skipped: then the staging images
    if: ${{ !cancelled() && needs.images.result != 'failure' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    uses: FedLearnNet/FL-Net-CLI/.github/workflows/e2e.yml@develop
    with:
      images: ${{ needs.images.outputs.images }}
    permissions:
      contents: read
      packages: read
