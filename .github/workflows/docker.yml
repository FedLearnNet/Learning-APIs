name: Docker images

on:
  push:
    branches: [main, develop]
    paths:
      - "*/src/main/**"
      - "**/pom.xml"
      - ".mvn/**"
      - "mvnw"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/fedlearnnet/learning-apis
  MODULES: global-learning-api local-learning-api datamodeler-api

jobs:
  # Version from pom.xml and whether it gets an image tag and a release, see FedLearnNet/.github/actions/version
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_image: ${{ steps.version.outputs.tag_image }}
      release: ${{ steps.version.outputs.release }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        uses: FedLearnNet/.github/actions/version@main

  images:
    needs: version
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Resolve build profile and tags
        id: vars
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG_IMAGE: ${{ needs.version.outputs.tag_image }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            profile=prod
            tags="latest prod"
          else
            profile=staging
            tags=staging
          fi
          if [ "$TAG_IMAGE" = true ]; then tags="$tags $VERSION"; fi
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Build Quarkus applications
        run: bash mvnw -B -ntp package -DskipTests -Dquarkus.profile=${{ steps.vars.outputs.profile }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push images
        env:
          TAGS: ${{ steps.vars.outputs.tags }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for module in $MODULES; do
            image="$REGISTRY/$module"
            tag_args=(-t "$image:${TAGS%% *}-${GITHUB_SHA::7}")
            for tag in $TAGS; do tag_args+=(-t "$image:$tag"); done
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --provenance=false \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.version=$VERSION" \
              "${tag_args[@]}" \
              -f "$module/src/main/docker/Dockerfile.jvm" \
              --push "$module"
          done

  # First build of a release candidate or release: git tag and GitHub release
  release:
    needs: [version, images]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$VERSION" --generate-notes --prerelease="$PRERELEASE"

  # Vulnerability scan after every build (results under Security → Code scanning)
  scan:
    needs: images
    uses: ./.github/workflows/scan.yml
    with:
      tag: ${{ github.ref == 'refs/heads/main' && 'latest' || 'staging' }}
    permissions:
      contents: read
      packages: read
      security-events: write
