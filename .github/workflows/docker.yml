name: Docker images

on:
  push:
    branches: [main, develop]
    paths:
      - "*/src/main/**"
      - "**/pom.xml"
      - ".mvn/**"
      - "mvnw"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/fedlearnnet/learning-apis
  MODULES: global-learning-api local-learning-api datamodeler-api

jobs:
  images:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Resolve build profile and tags
        id: vars
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "profile=prod" >> "$GITHUB_OUTPUT"
            echo "tags=latest prod" >> "$GITHUB_OUTPUT"
          else
            echo "profile=staging" >> "$GITHUB_OUTPUT"
            echo "tags=staging" >> "$GITHUB_OUTPUT"
          fi
      - name: Build Quarkus applications
        run: bash mvnw -B -ntp package -DskipTests -Dquarkus.profile=${{ steps.vars.outputs.profile }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push images
        env:
          TAGS: ${{ steps.vars.outputs.tags }}
        run: |
          for module in $MODULES; do
            image="$REGISTRY/$module"
            tag_args=(-t "$image:${TAGS%% *}-${GITHUB_SHA::7}")
            for tag in $TAGS; do tag_args+=(-t "$image:$tag"); done
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --provenance=false \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              "${tag_args[@]}" \
              -f "$module/src/main/docker/Dockerfile.jvm" \
              --push "$module"
          done

  # Vulnerability scan after every build (results under Security → Code scanning)
  scan:
    needs: images
    uses: ./.github/workflows/scan.yml
    with:
      tag: ${{ github.ref == 'refs/heads/main' && 'latest' || 'staging' }}
    permissions:
      contents: read
      packages: read
      security-events: write
