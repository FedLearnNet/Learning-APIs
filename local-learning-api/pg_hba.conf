# Local development/test database access rules.
# The Quarkus dev/test JDBC URL uses sslmode=disable, so host connections must
# be allowed without requiring hostssl.
local   all             all                                     trust
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256
host    all             all             0.0.0.0/0               scram-sha-256
host    all             all             ::/0                    scram-sha-256
