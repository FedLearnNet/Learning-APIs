# Ports/SSL/Timeouts
quarkus.http.test-port=8084
quarkus.http.test-ssl-port=8447
quarkus.http.test-timeout=10s
#Has to be the same as quarkus.http.test-port cuz, for the service we inject quarkus.http.port to start container
%test.quarkus.http.port=8084

%dev.quarkus.http.port=8081
%prod.quarkus.http.port=8080
quarkus.http.limits.max-body-size=3000M
quarkus.http.limits.max-form-attribute-size=100M

# Console logging
quarkus.log.console.json.enabled=false
%test,dev,staging.quarkus.log.console.json.enabled=false

#Startup
quarkus.banner.path=banner/banner.txt
%dev.quarkus.banner.path=banner/banner-dev.txt
%test.quarkus.banner.path=banner/banner-test.txt
%staging.quarkus.banner.path=banner/banner-stage.txt

#Docker compose devservice
%dev.quarkus.compose.devservices.enabled=true
%dev.quarkus.compose.devservices.start-services=true
%test.quarkus.compose.devservices.enabled=false
%dev.quarkus.compose.devservices.profiles=dev
quarkus.devservices.timeout=5m

# Keycloak
quarkus.keycloak.devservices.enabled=false
# DB
%dev.quarkus.datasource.devservices.enabled = false
%test.quarkus.datasource.devservices.enabled = false
#

# OIDC
# endpoints/urls
# discovery is buggy with the nginx setup, so we disable it and set the endpoints and urls manually
quarkus.oidc.discovery-enabled=false

## URLS
quarkus.oidc.auth-server-url=http://keycloak:8080/auth/realms/FLNet-Client
quarkus.oidc.token.issuer=VIA_ENV
%dev.quarkus.oidc.auth-server-url=https://staging.featurecloud.ai/feddb/local-auth/realms/fedDB-local
%test.quarkus.oidc.auth-server-url=https://staging.featurecloud.ai/feddb/local-auth/realms/fedDB-local

%dev,test.quarkus.oidc.token.issuer=https://staging.featurecloud.ai/feddb/local-auth/realms/fedDB-local

## Endpoints
quarkus.oidc.jwks-path=/protocol/openid-connect/certs
quarkus.oidc.token-path=/protocol/openid-connect/token
quarkus.oidc.authorization-path=/protocol/openid-connect/auth
quarkus.oidc.introspection-path=/protocol/openid-connect/token/introspect

# Login credentials
quarkus.oidc.client-id=local-learning-api
quarkus.oidc.credentials.secret=VIA_ENV

# details for the admin client
quarkus.keycloak.admin-client.server-url=http://keycloak:8080/auth
quarkus.keycloak.admin-client.realm=FLNet-Client
%dev,test.quarkus.keycloak.admin-client.server-url=https://staging.featurecloud.ai/feddb/local-auth
%dev,test.quarkus.keycloak.admin-client.realm=fedDB-local
quarkus.keycloak.admin-client.client-id=local-learning-api
quarkus.keycloak.admin-client.client-secret=VIA_ENV
quarkus.keycloak.admin-client.grant-type=CLIENT_CREDENTIALS

# Misc
quarkus.oidc.connection-retry-count=10
quarkus.oidc.connection-timeout=20S
quarkus.oidc.connection-delay=30S

# Keycloak: named OIDC client shared by the WebSocket and HTTP clients of the global service.
%dev.quarkus.oidc-client.global-websocket.auth-server-url=https://staging.featurecloud.ai/feddb/global-auth/realms/FederatedDB_Global
#%prod.quarkus.oidc-client.global-websocket.auth-server-url= VIA ENV
quarkus.oidc-client.global-websocket.client-id=frontend
quarkus.oidc-client.global-websocket.grant.type=password
quarkus.oidc-client.global-websocket.refresh-token-time-skew=60S
quarkus.oidc-client.global-websocket.connection-retry-count=10
quarkus.oidc-client.global-websocket.connection-timeout=20S

# Swagger
quarkus.smallrye-openapi.info-title=Local Learning API
%dev.quarkus.smallrye-openapi.info-title=Local Learning API (development)
%test.quarkus.smallrye-openapi.info-title=Local Learning API(test)
%staging.quarkus.smallrye-openapi.info-title=Local Learning API (staging)
quarkus.smallrye-openapi.info-version=1.0.1
quarkus.smallrye-openapi.info-description=A service to locally manage federated learning, querries and general logging
quarkus.smallrye-openapi.info-terms-of-service=TODO
quarkus.smallrye-openapi.info-contact-email=featurecloud@cosy.bio
quarkus.smallrye-openapi.info-contact-name=Cosy Bio Team
quarkus.smallrye-openapi.info-license-name=Apache 2.0
quarkus.smallrye-openapi.info-license-url=https://www.apache.org/licenses/LICENSE-2.0.html
quarkus.swagger-ui.always-include=true

quarkus.smallrye-openapi.security-scheme=oauth2-implicit
quarkus.smallrye-openapi.security-scheme-name=Keycloak
