%staging.quarkus.smallrye-openapi.oauth2-implicit-authorization-url=https://staging.featurecloud.ai/feddb/local-auth/realms/fedDB-local/protocol/openid-connect/auth
%staging.quarkus.smallrye-openapi.oauth2-implicit-refresh-url=https://staging.featurecloud.ai/feddb/local-auth/realms/fedDB-local/protocol/openid-connect/token
%staging.quarkus.swagger-ui.oauth2-redirect-url=http://localhost:8081/q/swagger-ui/oauth2-redirect.html

quarkus.smallrye-openapi.oauth2-implicit-authorization-url=https://staging.featurecloud.ai/feddb/local-auth/realms/fedDB-local/protocol/openid-connect/auth
quarkus.smallrye-openapi.oauth2-implicit-refresh-url=https://staging.featurecloud.ai/feddb/local-auth/realms/fedDB-local/protocol/openid-connect/token
