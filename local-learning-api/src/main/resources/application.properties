# OIDC/security, OpenAPI/Swagger and flnet.* settings live in their own files
quarkus.config.locations=security.properties,openapi.properties,flnet.properties

# Ports/SSL/Timeouts
quarkus.http.test-port=8084
quarkus.http.test-ssl-port=8447
quarkus.http.test-timeout=10s
#Has to be the same as quarkus.http.test-port cuz, for the service we inject quarkus.http.port to start container
%test.quarkus.http.port=8084

%dev.quarkus.http.port=8081
%prod.quarkus.http.port=8080
quarkus.http.limits.max-body-size=3000M
quarkus.http.limits.max-form-attribute-size=100M

# Console logging
quarkus.log.console.json.enabled=false
%test,dev,staging.quarkus.log.console.json.enabled=false

#Startup
quarkus.banner.path=banner/banner.txt
%dev.quarkus.banner.path=banner/banner-dev.txt
%test.quarkus.banner.path=banner/banner-test.txt
%staging.quarkus.banner.path=banner/banner-stage.txt

#Docker compose devservice
%dev.quarkus.compose.devservices.enabled=true
%dev.quarkus.compose.devservices.start-services=true
%test.quarkus.compose.devservices.enabled=false
%dev.quarkus.compose.devservices.profiles=dev
quarkus.devservices.timeout=5m

# Keycloak
quarkus.keycloak.devservices.enabled=false
# DB
%dev.quarkus.datasource.devservices.enabled = false
%test.quarkus.datasource.devservices.enabled = false

# Database
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.hibernate-orm.jdbc.statement-batch-size=50
%prod.quarkus.datasource.db-kind = postgresql
%prod.quarkus.datasource.jdbc.url = jdbc:postgresql://local-learning-db:5432/local-learning-management

%staging.quarkus.datasource.db-kind = postgresql
%staging.quarkus.datasource.jdbc.url = jdbc:postgresql://local-learning-db:5432/local-learning-management

# Flyway is the only schema owner in deployed environments. Hibernate validates
# the migrated schema but must never create, update, or drop deployed tables.
%prod,staging.quarkus.hibernate-orm.schema-management.strategy=validate
%prod,staging.quarkus.hibernate-orm.sql-load-script=no-file

%dev,test.quarkus.datasource.db-kind = postgresql
%dev,test.quarkus.datasource.username=user
%dev,test.quarkus.datasource.password=password
%dev,test.quarkus.hibernate-orm.schema-management.strategy = drop-and-create
%dev,test.quarkus.hibernate-orm.sql-load-script = import-test/base.sql,import-test/cohort.sql,import-test/schema.sql,import-test/patient.sql,import-test/query.sql,import-test/learning.sql
%dev,test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/local-learning-management?sslmode=disable

# Flyway
quarkus.flyway.enabled=false
%prod,staging.quarkus.flyway.enabled=true
%prod,staging.quarkus.flyway.migrate-at-start=true
%prod,staging.quarkus.flyway.baseline-on-migrate=true

# Socket
# 2 gb messages, this can only ever be done by authenticated user of the node
# so they are trustworthy to not abuse this
# Max Int so cannot set more!
quarkus.websockets-next.client.max-frame-size=1048576
quarkus.websockets-next.client.max-message-size=16777216
quarkus.websockets-next.server.max-frame-size=2147483647
quarkus.websockets-next.server.max-message-size=2147483647
quarkus.websockets-next.client.offer-per-message-compression=true
quarkus.websockets-next.client.compression-level=6

#%dev.quarkus.websockets-next.server.traffic-logging.enabled=true
#%dev.quarkus.websockets-next.server.traffic-logging.text-payload-limit=50
#%dev.quarkus.log.category."io.quarkus.websockets.next.traffic".level=DEBUG
quarkus.websockets-next.client.auto-ping-interval=10

# Hibernate Envers Configuration
quarkus.hibernate.envers.revision_on_collection_change=true
quarkus.hibernate-envers.audit-table-suffix=_audit
quarkus.hibernate-envers.revision-field-name=rev
quarkus.hibernate-envers.revision-type-field-name=revtype
quarkus.hibernate-envers.store-data-at-delete=false
# can be received from the prev revision
quarkus.hibernate-envers.revision-listener=bio.cosy.feddb.local.api.cohort.patient.traceability.crud.UserRevisionListener

# Local Services #8082 for local dev if you run the service locally
quarkus.rest-client.orch-docker-service.url=http://localhost:8091
# Starting a workflow may require orch-api to pull the app image first, which can take far longer than
# the 30s rest-client default. Allow a generous read timeout so a genuine first-time pull is not killed.
# (With orch.docker.pull.skip-if-present and pre-bundled images, the common case returns quickly.)
quarkus.rest-client.orch-docker-service.connect-timeout=10000
quarkus.rest-client.orch-docker-service.read-timeout=300000
quarkus.rest-client.controller-api.url=http://localhost:8092
quarkus.rest-client.data-importer-api.url=http://dataimporter-api:8000
%dev,test.quarkus.rest-client.data-importer-api.url=http://localhost:8000

# Global Services
#default points to microbaiome platform, can be overridden in staging/dev/test
quarkus.rest-client.global-schema-api.url=https://dev.federated-learning.net/data-modeler
# Must be set in prod as depends on the project
# Staging uses the same for all projects
%staging.quarkus.rest-client.global-schema-api.url=https://dev.federated-learning.net/data-modeler
%dev.quarkus.rest-client.global-schema-api.url=https://dev.federated-learning.net/data-modeler
#%test.quarkus.rest-client.global-schema-api.url=http://localhost:8093
quarkus.rest-client.global-api.url=http://localhost:8080

#only for test
%test.quarkus.rest-client.test-relay-api.url=http://localhost:9151

#for allowing scheduling connectors
quarkus.scheduler.enabled=true
quarkus.scheduler.start-mode=forced

quarkus.flyway.baseline-on-migrate=true

%test.quarkus.flyway.clean-at-start=true

%dev.quarkus.flyway.clean-at-start=true

quarkus.flyway.migrate-at-start=true
