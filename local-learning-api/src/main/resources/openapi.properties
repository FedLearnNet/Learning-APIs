# OpenAPI document and Swagger UI of this service (Swagger UI only in dev/test).
# Loaded via quarkus.config.locations in application.properties.

# Swagger
quarkus.smallrye-openapi.info-title=Local Learning API
%dev.quarkus.smallrye-openapi.info-title=Local Learning API (development)
%test.quarkus.smallrye-openapi.info-title=Local Learning API(test)
%staging.quarkus.smallrye-openapi.info-title=Local Learning API (staging)
quarkus.smallrye-openapi.info-version=1.0.1
quarkus.smallrye-openapi.info-description=A service to locally manage federated learning, querries and general logging
quarkus.smallrye-openapi.info-terms-of-service=TODO
quarkus.smallrye-openapi.info-contact-email=featurecloud@cosy.bio
quarkus.smallrye-openapi.info-contact-name=Cosy Bio Team
quarkus.smallrye-openapi.info-license-name=Apache 2.0
quarkus.smallrye-openapi.info-license-url=https://www.apache.org/licenses/LICENSE-2.0.html

# Swagger UI only in development
%dev,test.quarkus.swagger-ui.always-include=true

# no public API description in deployments (nginx also forwards /q/...)
%prod,staging.quarkus.smallrye-openapi.enabled=false

# Swagger UI login
quarkus.smallrye-openapi.security-scheme=oauth2-implicit
quarkus.smallrye-openapi.security-scheme-name=Keycloak
%dev.quarkus.smallrye-openapi.oauth2-implicit-authorization-url=https://staging.featurecloud.ai/feddb/local-auth/realms/fedDB-local/protocol/openid-connect/auth
%dev.quarkus.smallrye-openapi.oauth2-implicit-refresh-url=https://staging.featurecloud.ai/feddb/local-auth/realms/fedDB-local/protocol/openid-connect/token
%dev.quarkus.swagger-ui.oauth2-redirect-url=http://localhost:8081/q/swagger-ui/oauth2-redirect.html
%staging.quarkus.smallrye-openapi.oauth2-implicit-authorization-url=https://staging.featurecloud.ai/feddb/local-auth/realms/fedDB-local/protocol/openid-connect/auth
%staging.quarkus.smallrye-openapi.oauth2-implicit-refresh-url=https://staging.featurecloud.ai/feddb/local-auth/realms/fedDB-local/protocol/openid-connect/token
%staging.quarkus.swagger-ui.oauth2-redirect-url=http://localhost:8081/q/swagger-ui/oauth2-redirect.html
quarkus.smallrye-openapi.oauth2-implicit-authorization-url=https://staging.featurecloud.ai/feddb/local-auth/realms/fedDB-local/protocol/openid-connect/auth
quarkus.smallrye-openapi.oauth2-implicit-refresh-url=https://staging.featurecloud.ai/feddb/local-auth/realms/fedDB-local/protocol/openid-connect/token
quarkus.swagger-ui.oauth2-redirect-url=http://localhost:8081/q/swagger-ui/oauth2-redirect.html
quarkus.swagger-ui.oauth-client-id=local-learning-api
