# FL-Net settings of this service (flnet.*); flnet.bff.* is in security.properties.
# Loaded via quarkus.config.locations in application.properties.

#Fl net config
flnet.global.socket.enabled=true
%test.flnet.global.socket.enabled=false
#%dev.flnet.global.socket.enabled=false
flnet.global.socket.uri=ws://localhost:8080

# Optional static global user login for deployments without a frontend login flow.
# Prefer POST /global/auth/login when a user logs in from the frontend.
flnet.global.auth.username=test
flnet.global.auth.password=test
# Optional escape hatch when a frontend already has a global bearer token.
# flnet.global.auth.authorization-header=Bearer <global-user-access-token>
%dev.flnet.global.socket.reconnect.attempts=5
flnet.global.socket.reconnect.attempts=-1
# -1 -> infinite retries
flnet.global.socket.reconnect.delay.init=1000
flnet.global.socket.reconnect.delay.reconnect=30000

flnet.privacy.query.min-count=100
flnet.privacy.statistics.enabled=true
# Keep broad statistics usable while avoiding exact small-group values.
flnet.privacy.statistics.min-subjects=10
flnet.privacy.statistics.count-rounding-base=5
flnet.privacy.statistics.unique-rounding-base=5
flnet.privacy.statistics.min-category-count=3
flnet.privacy.statistics.numeric-decimals=1
flnet.privacy.statistics.remove-extreme-values=true
flnet.privacy.statistics.keep-local-ids=false

flnet.request.data-statistics.enabled=true
%dev.flnet.request.data-statistics.return-all-on-empty=true

#Autoimport
%dev.flnet.auto-subscribe.enabled=true
%dev,test.flnet.auto-subscribe.us-130.global-schema-id=c4877033-3619-47c2-bf7d-37f48a2934b3
%dev,test.flnet.auto-subscribe.us-130.cohort-name=US 130 Schema
%dev,test.flnet.auto-subscribe.us-130.etl-data-path=/connectors/clinic_001.csv
%dev,test.flnet.auto-subscribe.us-130.connector-path=/connectors/us-130-clinics.json
%dev,test.flnet.auto-subscribe.us-130.add-for-user=test
%dev,test.flnet.auto-subscribe.us-130.enabled-file-watching=false

# Same US-130 schema, but extracted by the diabetic-130-US-hospital-dataset app instead of file
%dev.flnet.auto-subscribe.us-130-app.global-schema-id=c4877033-3619-47c2-bf7d-37f48a2934b3
%dev.flnet.auto-subscribe.us-130-app.cohort-name=US 130 App Schema
%dev.flnet.auto-subscribe.us-130-app.connector-path=/connectors/us-130-clinics-app.json
%dev.flnet.auto-subscribe.us-130-app.add-for-user=test
%dev.flnet.auto-subscribe.us-130-app.enabled-file-watching=false

# Same US-130 file import, but the rows pass through two chained app-based transformers:
%dev.flnet.auto-subscribe.us-130-app-transform.global-schema-id=c4877033-3619-47c2-bf7d-37f48a2934b3
%dev.flnet.auto-subscribe.us-130-app-transform.cohort-name=US 130 App Transform Schema
%dev.flnet.auto-subscribe.us-130-app-transform.connector-path=/connectors/us-130-app-transform.json
%dev.flnet.auto-subscribe.us-130-app-transform.etl-data-path=/connectors/clinic_001.csv
%dev.flnet.auto-subscribe.us-130-app-transform.add-for-user=test
%dev.flnet.auto-subscribe.us-130-app-transform.enabled-file-watching=false

# MIMIC-IV clinical database demo v2.2 onto the same federated diabetes schema.
%dev.flnet.auto-subscribe.mimic.global-schema-id=c4877033-3619-47c2-bf7d-37f48a2934b3
%dev.flnet.auto-subscribe.mimic.cohort-name=MIMIC IV Demo Schema
%dev.flnet.auto-subscribe.mimic.etl-data-path=/connectors/mimic-iv-demo-2.2.zip
%dev.flnet.auto-subscribe.mimic.connector-path=/connectors/mimic-iv-demo-2.2.json
%dev.flnet.auto-subscribe.mimic.use-default-cohort-permission=true
%dev.flnet.auto-subscribe.mimic.add-for-user=test
# The demo extract holds 100 patients, so the US-130 sample threshold of 100
# would reject every cohort query against it.
%dev.flnet.auto-subscribe.mimic.cohort-permission.query-sample-threshold=25
%dev.flnet.auto-subscribe.mimic.enabled-file-watching=false

#Cohort
## All other cohort default permissions are set via default annotation in FLNetClientConfig
%prod.flnet.cohort.cohort-permission.auto-metrics-access=NONE
%prod.flnet.cohort.cohort-permission.auto-statistics-access=NONE
%prod.flnet.cohort.cohort-permission.auto-training-access=NONE

%prod.flnet.cohort.deactivate-automatic-cohort-permission.metrics=true
%prod.flnet.cohort.deactivate-automatic-cohort-permission.statistics=true
%prod.flnet.cohort.deactivate-automatic-cohort-permission.learning=true

# Settings of the default permission being added on cohort creation
flnet.cohort.cohort-permission.enabled=false
%staging,dev,test.flnet.cohort.cohort-permission.enabled=true

# important features
flnet.user.system-user-name=SYSTEM
flnet.calendar.gregorian.adoption=pragmatic
flnet.cohort.delete-traceability=true
flnet.connector.external-id-column=Unique Patient ID
flnet.connector.etl-sort-chunk-size=50000
flnet.connector.preview-rows=10
# ETL spill dir; unset = JVM temp dir, point at a large volume for big inputs
# flnet.connector.etl-work-directory=/var/lib/feddb/etl-work
# Values: catholic, british, pragmatic
# The papal bull of February 1582 decreed that 10 days should be dropped from October 1582
# so that 15 October should follow immediately after 4 October.
# This was observed in Italy, Poland, Portugal, and Spain.
# Other Catholic countries followed shortly after,
# but Protestant countries were reluctant to change, and the Greek Orthodox countries didn't change
# until the start of the 20th century.
# The reform was observed by Great Britain and its dominions (including what is now the USA) in 1752.
# Thus 2 September 1752 was followed by 14 September 1752.
# Depending on the set system we reject these dates:
# catholic = 1582-10-5 to 1582-10-14
# british = 1752-09-3 to 1752-09-13
# pragmatic = we allow all dates.

# Relay certificate of the controller (mTLS towards the relay server), signed via the global server:
# resend the request after this time without an answer, fail the step after max-attempts requests
flnet.relay.cert-sign.timeout=PT5M
flnet.relay.cert-sign.max-attempts=3
