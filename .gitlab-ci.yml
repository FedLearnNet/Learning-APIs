# ─────────────────────────────────────────────────────────────────────────────
# Override all security scanning jobs

spotbugs-sast:
  image: openjdk:25-ea-jdk
  dependencies:
    - check:build:maven
  variables:
    COMPILE: "false"
    SECURE_LOG_LEVEL: debug
  rules:
    - !reference [ .security_default_rules, rules ]

gitlab-advanced-sast:
  image: openjdk:25-ea-jdk
  dependencies:
    - check:build:maven
  artifacts:
    paths:
      - '**/trace.ctf'
    expire_in: 1 week
    when: always
  variables:
    RUNNER_SCRIPT_TIMEOUT: 50m
  timeout: 1h
  rules:
    - !reference [ .security_default_rules, rules ]

container-scanning:local:
  extends: container_scanning
  stage: security
  needs:
    - check:build:docker:local
  dependencies:
    - check:build:docker:local
  variables:
    CS_IMAGE: "archive://image-latest-local.tar"
  rules:
    - !reference [ .security_default_rules, rules ]

container-scanning:global:
  extends: container_scanning
  stage: security
  needs:
    - check:build:docker:global
  dependencies:
    - check:build:docker:global
  variables:
    CS_IMAGE:  "archive://image-latest-global.tar"
  rules:
    - !reference [ .security_default_rules, rules ]

secret_detection:
  stage: security
  dependencies:
    - check:build:maven
  rules:
    - !reference [ .security_default_rules, rules ]
  variables:
    GIT_DEPTH: 100


  # applying rules here to run in merge requests somehow broke the job, so
  # we let the templat decide when this runs
gemnasium-maven-dependency_scanning:
  rules:
    - !reference [ .security_default_rules, rules ]
# We need to call the correct dependency scanning job for maven!

gemnasium-dependency_scanning:
  rules:
    - !reference [ .security_default_rules, rules ]
# Also call the generic scanner for the python files in the repo
