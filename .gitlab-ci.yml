image: openjdk:25-ea-jdk

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  # - template: Jobs/Code-Quality.gitlab-ci.yml curenttly we use maven for code quality
  # - template: Jobs/Code-Intelligence.gitlab-ci.yml not for java yet

stages:
  - check
  - test
  - build
  - security
  - deploy

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .m2/repository

# Helpers
variables:
  PROJECT_GLOBAL: global-learning-api
  PROJECT_DATAMODELER: datamodeler-api
  PROJECT_LOCAL: local-learning-api
  CI_IMAGE_BASE: $CI_REGISTRY/$CI_PROJECT_PATH

  GHCR_IMAGE_BASE: $GITHUB_REGISTRY/$GITHUB_OWNER/$CI_PROJECT_NAME
  GHCR_IMAGE_GLOBAL: $GHCR_IMAGE_BASE/$PROJECT_GLOBAL
  GHCR_IMAGE_DATAMODELER: $GHCR_IMAGE_BASE/$PROJECT_DATAMODELER
  GHCR_IMAGE_LOCAL: $GHCR_IMAGE_BASE/$PROJECT_LOCAL

  CI_IMAGE_GLOBAL_STAGING: $CI_IMAGE_BASE/$PROJECT_GLOBAL:staging
  CI_IMAGE_GLOBAL_PROD:    $CI_IMAGE_BASE/$PROJECT_GLOBAL:prod
  CI_IMAGE_GLOBAL_LATEST:  $CI_IMAGE_BASE/$PROJECT_GLOBAL:latest
  CI_IMAGE_DATAMODELER_STAGING: $CI_IMAGE_BASE/$PROJECT_DATAMODELER:staging
  CI_IMAGE_DATAMODELER_PROD:    $CI_IMAGE_BASE/$PROJECT_DATAMODELER:prod
  CI_IMAGE_DATAMODELER_LATEST:  $CI_IMAGE_BASE/$PROJECT_DATAMODELER:latest
  CI_IMAGE_LOCAL_STAGING:  $CI_IMAGE_BASE/$PROJECT_LOCAL:staging
  CI_IMAGE_LOCAL_PROD:     $CI_IMAGE_BASE/$PROJECT_LOCAL:prod
  CI_IMAGE_LOCAL_LATEST:   $CI_IMAGE_BASE/$PROJECT_LOCAL:latest

  SAST_JAVA_VERSION: "25"
  GITLAB_ADVANCED_SAST_ENABLED: "true"
  GIT_DEPTH: "0"
  CS_IMAGE: $CI_IMAGE_GLOBAL_LATEST

  DOCKER_TLS_CERTDIR: ""

.docker_login: &docker_login
  - docker info
  - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

.docker_login_ghcr: &docker_login_ghcr
  - echo "$GITHUB_TOKEN" | docker login $GITHUB_REGISTRY -u $GITHUB_USERNAME --password-stdin

.docker_buildx: &docker_buildx
  - docker context create fedDB-context
  - docker buildx create --name fedDBBuilder --use fedDB-context
  - docker buildx inspect --bootstrap


.prepare-test: &prepare_test
  - echo "http://dl-cdn.alpinelinux.org/alpine/edge/main" >> /etc/apk/repositories
  - echo "http://dl-cdn.alpinelinux.org/alpine/edge/community" >> /etc/apk/repositories
  - apk update
  - apk add --no-cache openjdk25 maven postgresql-client

.wait-for-postgres: &wait_for_postgres
  - |
    until pg_isready -h "$POSTGRES_HOST" -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
      echo "Waiting for PostgreSQL at $POSTGRES_HOST:5432..."
      sleep 2
    done

#https://docs.gitlab.com/ci/jobs/job_rules/#reuse-rules-in-different-jobs
.security_default_rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: on_success
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
      when: on_success
    - when: manual

# ─────────────────────────────────────────────────────────────────────────────
# Build and test
.check:build:maven:
  stage: check
  allow_failure: false
  artifacts:
    paths:
      - $PROJECT_GLOBAL/target
      - $PROJECT_LOCAL/target
      - $PROJECT_DATAMODELER/target
    expire_in: 1 hour
  rules:
    - when: always
        # always run, needed for merge request pipeline runs as without rules this doesnt run otherwise

check:build:maven:
  extends: .check:build:maven
  script:
    - ./mvnw clean install -DskipTests -DskipQualityCheck=false

# Unit/integration tests use explicit GitLab service containers.
# Quarkus Dev Services are disabled for these jobs so the database lifecycle
# is owned by the pipeline instead of the application test bootstrap.
check:test:local:
  image: docker:24.0.2
  dependencies:
    - check:build:maven
  needs:
    - check:build:maven
  services:
    - name: postgres:17-alpine
      alias: local-learning-db
  variables:
    POSTGRES_HOST: "local-learning-db"
    POSTGRES_DB: "local-learning-management"
    POSTGRES_USER: "user"
    POSTGRES_PASSWORD: "password"
    QUARKUS_DATASOURCE_DB_KIND: "postgresql"
    QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://local-learning-db:5432/local-learning-management"
    QUARKUS_DATASOURCE_USERNAME: "user"
    QUARKUS_DATASOURCE_PASSWORD: "password"
    QUARKUS_DATASOURCE_DEVSERVICES_ENABLED: "false"
    QUARKUS_COMPOSE_DEVSERVICES_ENABLED: "false"
    QUARKUS_DEVSERVICES_ENABLED: "false"
  before_script:
    - *prepare_test
    - *wait_for_postgres
  stage: check
  script:
    - ./mvnw clean -projects local-learning-api --also-make verify -DskipQualityCheck=false
  allow_failure: false
  coverage: '/TOTAL.+ ([0-9]{1,3}%)/'
  artifacts:
    reports:
      junit:
        - local-learning-api/target/surefire-reports/*.xml
  rules:
    - when: always
        # always run, needed for merge request pipeline runs as without rules this doesnt run otherwise

check:test:global:
  image: docker:24.0.2
  dependencies:
    - check:build:maven
  needs:
    - check:build:maven
  services:
    - name: pgvector/pgvector:pg18
      alias: global-learning-db
  variables:
    POSTGRES_HOST: "global-learning-db"
    POSTGRES_DB: "global-learning-management"
    POSTGRES_USER: "user"
    POSTGRES_PASSWORD: "password"
    QUARKUS_DATASOURCE_DB_KIND: "postgresql"
    QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://global-learning-db:5432/global-learning-management"
    QUARKUS_DATASOURCE_USERNAME: "user"
    QUARKUS_DATASOURCE_PASSWORD: "password"
    QUARKUS_DATASOURCE_DEVSERVICES_ENABLED: "false"
    QUARKUS_COMPOSE_DEVSERVICES_ENABLED: "false"
    QUARKUS_DEVSERVICES_ENABLED: "false"
  before_script:
    - *prepare_test
    - *wait_for_postgres
  stage: check
  script:
    - ./mvnw clean -projects global-learning-api --also-make verify -DskipQualityCheck=false
  allow_failure: false
  coverage: '/TOTAL.+ ([0-9]{1,3}%)/'
  artifacts:
    reports:
      junit:
        - global-learning-api/target/surefire-reports/*.xml
  rules:
    - when: always
        # always run, needed for merge request pipeline runs as without rules this doesnt run otherwise

check:test:local:e2e:
  image: docker:24.0.2
  services:
    - name: docker:24.0.2-dind
      alias: docker
  before_script:
    - *prepare_test
  stage: check
  when: manual
  script:
    - ./mvnw clean verify -Prun-e2e
  allow_failure: true

check:build:maven:prod:
  extends: .check:build:maven
  script:
    - ./mvnw clean install -DskipTests -Dquarkus.profile=prod
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'


check:build:maven:staging:
  extends: .check:build:maven
  script:
    - ./mvnw clean install -DskipTests -Dquarkus.profile=staging
  rules:
    - when: always

.check:build:docker:
  image: docker:24.0.2
  stage: check
  services:
    - name: docker:24.0.2-dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "tcp://docker:2375"
  before_script:
    - *docker_login
  script:
    - echo "Building Docker image $CI_IMAGE for $PROJECT/src/main/docker/Dockerfile.jvm"
    - docker build -t $CI_IMAGE -f $PROJECT/src/main/docker/Dockerfile.jvm $PROJECT
    - docker save -o $TAR_FILE_NAME $CI_IMAGE
    - chmod 644 $TAR_FILE_NAME
    - echo "API image created at $TAR_FILE_NAME"
  artifacts:
    paths:
      - $TAR_FILE_NAME
    expire_in: 1 hour
  rules:
    - when: always
        # always run, needed for merge request pipeline runs as without rules this doesnt run otherwise

check:build:docker:global:
  extends: .check:build:docker
  dependencies:
    - check:build:maven
  needs:
    - check:build:maven
  variables:
    CI_IMAGE: image-global:latest
    PROJECT: $PROJECT_GLOBAL
    TAR_FILE_NAME: image-latest-global.tar

check:build:docker:local:
  extends: .check:build:docker
  dependencies:
    - check:build:maven
  needs:
    - check:build:maven
  variables:
    CI_IMAGE: image-local:latest
    PROJECT: $PROJECT_LOCAL
    TAR_FILE_NAME: image-latest-local.tar

# ─────────────────────────────────────────────────────────────────────────────
# test
# If we think that gitlab code quality is not good enough, we can run the linters and integrate them later
# https://github.com/chkal/gitlab-code-quality-plugin
test:linters:
  stage: test
  image: openjdk:25-ea-jdk
  #dependencies:
  #  - check:build:maven
  #needs:
  #  - check:build:maven
  before_script:
    - apt-get update && apt-get install -y jq
  script:
    - ./mvnw clean verify -DskipTests
  after_script:
    - find . -name gl-code-quality-report.json -print | xargs cat | jq -s "add" > merged-gl-code-quality-report.json
  artifacts:
    when: always
    paths:
      - global-learning-api/target/*.xml
      - local-learning-api/target/*.xml
      - core-learning-api/target/*.xml
      - global-learning-api/target/reports/*
      - local-learning-api/target/reports/*
      - core-learning-api/target/reports/*
      - global-learning-api/target/gl-code-quality-report.json
      - local-learning-api/target/gl-code-quality-report.json
      - core-learning-api/target/gl-code-quality-report.json
      - merged-gl-code-quality-report.json
    reports:
      codequality:
        - merged-gl-code-quality-report.json
  allow_failure: true

# ─────────────────────────────────────────────────────────────────────────────
# deploy
.deploy:gitlab_registry:
  image: docker:24.0.2
  stage: deploy
  services:
    - name: docker:24.0.2-dind
      alias: docker
  only:
    - develop
    - main
    - master
  before_script:
    - *docker_login
    - *docker_buildx
  script:
    - docker buildx build --platform linux/amd64,linux/arm64/v8 --provenance false -t $CI_IMAGE -f $PROJECT/$DOCKERFILE --push $CONTEXT

.deploy:github_registry:
  image: docker:24.0.2
  stage: deploy
  services:
    - name: docker:24.0.2-dind
      alias: docker
  only:
    - develop
    - main
    - master
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "tcp://docker:2375"
  before_script:
    - *docker_login_ghcr
    - *docker_buildx
  script:
    - docker buildx build --platform linux/amd64,linux/arm64/v8 --provenance false -t $CI_IMAGE -f $PROJECT/$DOCKERFILE --push $CONTEXT

